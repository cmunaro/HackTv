# Minimal RFS-only update for Hisense 58A7140F / MICALIDVB6886 U4 L1103.
# It intentionally does not repartition or touch MBOOT, kernel, OP-TEE,
# calibration, certificates, applications, or persistent user data.

[Main]
FirmwareFileName=build/usb_MICALIDVB6886_U4_DUAL_ROOT_SSH.bin
ProjectFolder=./rfs-probe
useHexValuesPrefix=true

SCRIPT_FIRMWARE_FILE_NAME=$$(UpgradeImage)
DRAM_BUF_ADDR=27800000
MAGIC_FOOTER=12345678
HEADER_SIZE=16KB
USE_XGIMI_CRC2=true
RAW_TRAILER_FILE=${ProjectFolder}/hisense-vendor-trailer.bin

[HeaderScript]
Prefix:

Suffix:
	setenv str_crc 2
	setenv db_table 0
	setenv verify n
	setenv partial_partition ON
	saveenv
	setenv upgrade_mode null
	setenv MstarUpgrade_complete 1
	saveenv

[part/RFS]
erase=True
imageFile=${Main:ProjectFolder}/RFS.ssh.img
type=partitionImage
lzo=False
chunkSize=0
emptySkip=True

[part/RFSB]
erase=True
imageFile=${Main:ProjectFolder}/RFS.ssh.img
type=partitionImage
lzo=False
chunkSize=0
emptySkip=True
